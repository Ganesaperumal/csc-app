name: Generate Debug Report
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node Dependencies
        run: |
          cd scripts
          npm install
          npx playwright install chromium --with-deps

      - name: Run Debug Script
        env:
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          ERP_SITE: ${{ secrets.ERP_SITE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          node debug_report.js

      - name: Upload Debug Report CSV to file.io
        run: |
          cd scripts
          echo "Uploading debug_report.csv to file.io..."
          curl -F "file=@debug_report.csv" https://file.io/?expires=1d
