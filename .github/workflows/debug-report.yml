name: Generate Debug Report
on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node Dependencies
        run: |
          cd scripts
          npm install
          npx playwright install chromium --with-deps

      - name: Run Debug Script
        env:
          ERP_USERNAME: ${{ secrets.ERP_USERNAME }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          ERP_SITE: ${{ secrets.ERP_SITE }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          node debug_report.js

      - name: Print Debug Report to Summary
        run: |
          cd scripts
          echo '### ERP Sync Debug Report' >> $GITHUB_STEP_SUMMARY
          echo '| Job Number | Supabase Enq Number | ERP Match Found? | Matched ERP Enq Number | Raw ERP Quote Value | Raw ERP Final Quote Value | Calculated Final Value |' >> $GITHUB_STEP_SUMMARY
          echo '|---|---|---|---|---|---|---|' >> $GITHUB_STEP_SUMMARY
          # Skip the first row (header) and convert CSV to Markdown table
          tail -n +2 debug_report.csv | sed 's/,/ | /g' | awk '{print "| " $0 " |"}' >> $GITHUB_STEP_SUMMARY
