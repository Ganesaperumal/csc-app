name: Sync ERP Jobs to Supabase

on:
  workflow_dispatch: # Allows manual triggering via GitHub API / Dashboard
  schedule:
    - cron: '0 3,6,9,12,15 * * *'

jobs:
  run-sync-jobs:
    uses: ./.github/workflows/sync-erp-jobs.yml
    secrets: inherit

  run-sync-enq:
    needs: run-sync-jobs
    uses: ./.github/workflows/sync-erp-enq.yml
    secrets: inherit
